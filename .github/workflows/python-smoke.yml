name: Python Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile entrypoint
        run: python -m py_compile sanctified_monolith.py associative_memory.py examples/associative_memory_demo.py
      - name: Run isolated memory and CLI regressions
        run: python -m unittest discover -s tests -v
      - name: Demonstrate sequential associative retention
        run: python examples/associative_memory_demo.py
